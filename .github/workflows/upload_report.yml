name: Build and Upload Typst Thesis Using the Nix Flake

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
          contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build Thesis via Nix Flake
        run: |
          mkdir -p output
          nix develop --command typst compile bachelor_thesis.typ output/bachelor_thesis.pdf

      - name: Upload PDF as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bachelor-thesis-pdf
          path: output/bachelor_thesis.pdf

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-latest
          name: Latest Thesis
          body: Always points to the most recent successful build.
          files: output/bachelor_thesis.pdf
          draft: false
          make_latest: true

      - name: Archive Versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: thesis-build-${{ github.run_number }}
          name: Thesis Build #${{ github.run_number }}
          body: Historical snapshot from commit ${{ github.sha }}
          files: output/bachelor_thesis.pdf
          draft: false
          make_latest: false
